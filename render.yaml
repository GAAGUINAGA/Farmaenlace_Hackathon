# FarmaPOS en Render como Static Site (landing en /, demo en /demo y resultados en /resultados).
services:
  - type: web
    name: farmapos
    runtime: static
    buildCommand: npm install && npm run build:static
    staticPublishPath: dist
    envVars:
      # Vite 8 necesita Node ^20.19 o >=22.12.
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      # Todas las rutas del cliente (/demo, /resultados) se resuelven en el index.html del SPA.
      - type: rewrite
        source: /*
        destination: /index.html
